name: Multi-user ingest checks

on:
  push:
    branches:
      - feature/multiuser-ingest-boundary
  pull_request:
    paths:
      - "backend/app/api/ingest.py"
      - "backend/app/services/ingest_access.py"
      - "backend/app/services/ingest_import_job.py"
      - "backend/app/services/watcher.py"
      - "backend/app/services/permessi.py"
      - "backend/app/models.py"
      - "backend/app/main.py"
      - "backend/tests/**"
      - "backend/app/api/library_transfer.py"
      - "backend/app/api/opds.py"
      - "backend/app/api/libraries.py"
      - "backend/app/api/devices.py"
      - "frontend-react/**"
      - ".github/workflows/multiuser-ingest.yml"

jobs:
  test-ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend Python sources
        run: python -m compileall -q app tests
      - name: Run ingest isolation tests
        run: python -m unittest discover -s tests -p 'test_ingest_access.py' -v

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check and build React UI
        run: npm run build
